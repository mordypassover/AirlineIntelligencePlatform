name: airline-intelligence
x-app-env: &app-env
  POSTGRES_CONNECTION_STRING: Host=postgres;Port=5432;Database=${POSTGRES_DB:-airline_intelligence};Username=${POSTGRES_USER:-airline};Password=${POSTGRES_PASSWORD:-airline_dev}
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-airline_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-airline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airline_dev}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, "pg_isready -U ${POSTGRES_USER:-airline} -d ${POSTGRES_DB:-airline_intelligence}"], interval: 5s, timeout: 5s, retries: 20}
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes: [redis-data:/data]
    healthcheck: {test: [CMD, redis-cli, ping], interval: 5s, timeout: 3s, retries: 20}
    restart: unless-stopped
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports: ["29092:29092"]
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck: {test: [CMD-SHELL, "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"], interval: 10s, timeout: 10s, retries: 20}
    restart: unless-stopped
  kafka-init:
    image: apache/kafka:3.9.1
    depends_on: {kafka: {condition: service_healthy}}
    command: ["/bin/bash", "-c", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic airline.reviews --partitions 1 --replication-factor 1 && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic airline.sentiment --partitions 1 --replication-factor 1 && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic airline.prices --partitions 1 --replication-factor 1 && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic airline.flights --partitions 1 --replication-factor 1 && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic airline.environment --partitions 1 --replication-factor 1"]
  api:
    build: {context: ., dockerfile: backend/AirlineApi/Dockerfile}
    environment:
      <<: *app-env
      ASPNETCORE_URLS: http://+:8080
      REDIS_CONNECTION_STRING: redis:6379
      JWT_SECRET: ${JWT_SECRET:-development-secret-at-least-32-characters}
      JWT_ISSUER: ${JWT_ISSUER:-AirlineIntelligence}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-AirlineIntelligence.Web}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@airline.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe123!}
      STATISTICS_CACHE_SECONDS: ${STATISTICS_CACHE_SECONDS:-60}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports: ["8080:8080"]
    healthcheck: {test: [CMD-SHELL, "curl -fsS http://localhost:8080/health || exit 1"], interval: 10s, timeout: 5s, retries: 20, start_period: 15s}
    restart: unless-stopped
  review-collector:
    build: {context: ., dockerfile: backend/ReviewCollector/Dockerfile}
    environment: {<<: *app-env, REVIEWS_INTERVAL_SECONDS: "${REVIEWS_INTERVAL_SECONDS:-30}"}
    depends_on: {api: {condition: service_healthy}, kafka-init: {condition: service_completed_successfully}}
    restart: unless-stopped
  sentiment-service:
    build: {context: ., dockerfile: backend/SentimentService/Dockerfile}
    environment: {KAFKA_BOOTSTRAP_SERVERS: kafka:9092}
    depends_on: {kafka-init: {condition: service_completed_successfully}}
    restart: unless-stopped
  price-collector:
    build: {context: ., dockerfile: backend/PriceCollector/Dockerfile}
    environment: {<<: *app-env, PRICES_INTERVAL_SECONDS: "${PRICES_INTERVAL_SECONDS:-20}"}
    depends_on: {api: {condition: service_healthy}, kafka-init: {condition: service_completed_successfully}}
    restart: unless-stopped
  flight-collector:
    build: {context: ., dockerfile: backend/FlightCollector/Dockerfile}
    environment:
      <<: *app-env
      FLIGHTS_INTERVAL_SECONDS: "${FLIGHTS_INTERVAL_SECONDS:-900}"
      ISRAEL_FLIGHTS_API_URL: "${ISRAEL_FLIGHTS_API_URL:-https://data.gov.il/api/3/action/datastore_search?resource_id=e83f763b-b7d7-479e-b172-ae981ddc6de5&limit=500}"
    depends_on: {api: {condition: service_healthy}, kafka-init: {condition: service_completed_successfully}}
    restart: unless-stopped
  analytics-service:
    build: {context: ., dockerfile: backend/AnalyticsService/Dockerfile}
    environment: {<<: *app-env}
    depends_on: {api: {condition: service_healthy}, kafka-init: {condition: service_completed_successfully}}
    restart: unless-stopped
  frontend:
    build: ./frontend
    depends_on: {api: {condition: service_healthy}}
    ports: ["3000:80"]
    restart: unless-stopped
volumes: {postgres-data: {}, redis-data: {}, kafka-data: {}}
